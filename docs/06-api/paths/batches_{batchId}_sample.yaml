get:
  tags:
    - Batch
  summary: Get the sample of a batch
  description: >-
    The sample with why each item was selected, its mark, the label "selected
    without AI", the number still to mark, the number of invoices not yet in the
    sample, and the history of expansions (AC-24.3, AC-24.5, AC-24.12,
    AC-24.13).
  operationId: getBatchSample
  security:
    - sessionCookie: []
  x-roles:
    - AP_ACCOUNTANT
  x-stories:
    - US-24
  x-rules:
    - BR-07
  x-screens:
    - SCR-30
    - SCR-33
  x-tables:
    - batch_sample_items
    - sample_expansions
    - payment_batches
    - invoices
  x-criteria:
    - AC-24.2
    - AC-24.3
    - AC-24.5
    - AC-24.8
    - AC-24.12
    - AC-24.13
    - AC-24.14
  parameters:
    - $ref: ../components/parameters/batchId.yaml
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BatchSample.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml

get:
  tags:
    - Users
  summary: List ERP users to link
  description: >-
    Lists the ERP users copied by the sync for the link in the user form
    (AC-02.4). Entity Admin: own entity. Group Admin: `entityId` is required.
  operationId: listErpUsers
  security:
    - sessionCookie: []
  x-roles:
    - ENTITY_ADMIN
    - GROUP_ADMIN
  x-stories:
    - US-02
  x-rules:
    - BR-02
  x-screens:
    - SCR-71
  x-tables:
    - erp_users
    - entities
  x-criteria:
    - AC-02.4
  parameters:
    - name: entityId
      in: query
      required: false
      description: Group Admin only.
      schema:
        $ref: ../components/schemas/Id.yaml
    - name: q
      in: query
      required: false
      description: Part of the display name.
      schema:
        type: string
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErpUserRefPage.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml

get:
  tags:
    - Mailbox
  summary: Get a mailbox message
  description: >-
    One message with its attachments and results. A message of another entity
    gives 403 ACCESS_DENIED (AC-31.8).
  operationId: getMailboxMessage
  security:
    - sessionCookie: []
  x-roles:
    - AP_ACCOUNTANT
  x-stories:
    - US-31
  x-rules:
    - BR-09
  x-screens:
    - SCR-24
  x-tables:
    - mailbox_messages
    - mailbox_attachments
    - invoices
  x-criteria:
    - AC-31.8
  parameters:
    - $ref: ../components/parameters/messageId.yaml
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MailboxMessage.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml

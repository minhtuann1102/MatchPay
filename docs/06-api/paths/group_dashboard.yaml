get:
  tags:
    - Dashboard and group overview
  summary: Get per-entity figures for the group
  description: >-
    Counts and rates for each entity and no invoice-level data (AC-27.7, DF-23,
    BR-09).
  operationId: getGroupDashboard
  security:
    - sessionCookie: []
  x-roles:
    - GROUP_ADMIN
  x-stories:
    - US-27
  x-rules:
    - BR-09
  x-screens:
    - SCR-60
  x-tables:
    - invoices
    - exceptions
    - batch_items
    - batch_sample_items
    - entities
  x-criteria:
    - AC-27.7
  parameters:
    - name: period
      in: query
      required: false
      description: Calendar month as YYYY-MM.
      schema:
        type: string
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/GroupDashboard.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml

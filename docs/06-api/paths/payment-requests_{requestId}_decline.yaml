post:
  tags:
    - Signing
  summary: Decline a payment request
  description: >-
    Cancels the whole request with a required reason and returns all its
    invoices to exceptions (R6, AC-25.7). The AP Accountant gets "Request
    returned" with the reason (AC-32.3). Carries `version`. Appends to
    audit_log.
  operationId: declineRequest
  security:
    - sessionCookie: []
      csrfHeader: []
  x-roles:
    - CHIEF_ACCOUNTANT
    - PAYMENT_APPROVER
  x-stories:
    - US-25
  x-rules:
    - BR-35
    - BR-37
  x-screens:
    - SCR-54
    - SCR-51
  x-tables:
    - payment_requests
    - payment_request_lines
    - request_signatures
    - invoices
    - exceptions
    - exception_reasons
    - notifications
    - audit_log
  x-criteria:
    - AC-25.7
    - AC-32.3
  parameters:
    - $ref: ../components/parameters/requestId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/DeclineRequestRequest.yaml
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RequestChangeResult.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml

get:
  tags:
    - ERP sync
  summary: Get the last ERP sync time and the stale warning
  description: >-
    Returns the last successful sync, the latest run, and `isStale` when a later
    run failed; invoices are then checked against the earlier data with that
    time shown (AC-07.7). Computed from erp_sync_runs (D-142).
  operationId: getErpSyncStatus
  security:
    - sessionCookie: []
  x-roles:
    - AP_ACCOUNTANT
    - CHIEF_ACCOUNTANT
    - PAYMENT_APPROVER
  x-stories:
    - US-07
  x-rules:
    - BR-25
  x-screens:
    - SCR-10
  x-tables:
    - erp_sync_runs
  x-criteria:
    - AC-07.7
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErpSyncStatus.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml

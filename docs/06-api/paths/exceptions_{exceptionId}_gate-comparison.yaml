post:
  tags:
    - Exceptions
  summary: Record the gate comparison
  description: >-
    For an exception "Gate closed": the AP Accountant states whether every AI
    result stood unchanged. Unchanged counts as correct for the accuracy of the
    pair; a change counts as incorrect (AC-18.4, DF-17). Writes a
    gate_comparisons row, then UC-16 runs again; 202.
  operationId: confirmAiResults
  security:
    - sessionCookie: []
      csrfHeader: []
  x-roles:
    - AP_ACCOUNTANT
  x-stories:
    - US-18
    - US-06
  x-rules:
    - BR-06
    - BR-34
    - BR-37
  x-screens:
    - SCR-12
  x-tables:
    - gate_comparisons
    - supplier_gates
    - exceptions
    - invoice_check_runs
    - audit_log
  x-criteria:
    - AC-18.4
    - AC-06.3
  parameters:
    - $ref: ../components/parameters/exceptionId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ConfirmAiResultsRequest.yaml
  responses:
    '202':
      description: Saved; check run queued
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ExceptionActionResult.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml

get:
  tags:
    - Mailbox
  summary: List mailbox messages
  description: >-
    One row per message with each attachment and its result: the invoice
    created, Rejected with the reason ("Only XML e-invoices are accepted in the
    MVP", a duplicate, another entity's tax code, a failed signature), or "No
    attachment" (AC-31.1..AC-31.6). A message fetched before is not processed
    again (AC-31.4).
  operationId: listMailboxMessages
  security:
    - sessionCookie: []
  x-roles:
    - AP_ACCOUNTANT
  x-stories:
    - US-31
  x-rules:
    - BR-01
    - BR-09
    - BR-11
    - BR-17
  x-screens:
    - SCR-24
  x-tables:
    - mailbox_messages
    - mailbox_attachments
    - invoices
  x-criteria:
    - AC-31.1
    - AC-31.2
    - AC-31.3
    - AC-31.4
    - AC-31.5
    - AC-31.6
    - AC-31.8
  parameters:
    - name: outcome
      in: query
      required: false
      description: Filter by message result.
      schema:
        $ref: ../components/schemas/MessageOutcome.yaml
    - name: attachmentOutcome
      in: query
      required: false
      description: Filter by attachment result.
      schema:
        $ref: ../components/schemas/AttachmentOutcome.yaml
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MailboxMessagePage.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml

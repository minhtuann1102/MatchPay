get:
  tags:
    - ERP sync
  summary: List ERP sync runs
  description: >-
    Lists the sync runs of the caller's entity with totals read, stored, and
    rejected. The sync is read-only against the ERP (BR-25, AC-07.1).
  operationId: listErpSyncRuns
  security:
    - sessionCookie: []
  x-roles:
    - AP_ACCOUNTANT
  x-stories:
    - US-07
  x-rules:
    - BR-09
    - BR-25
  x-screens:
    - SCR-10
  x-tables:
    - erp_sync_runs
    - erp_sync_rejections
  x-criteria:
    - AC-07.1
    - AC-07.2
    - AC-07.3
    - AC-07.8
  parameters:
    - name: status
      in: query
      required: false
      description: Filter by status.
      schema:
        $ref: ../components/schemas/SyncStatus.yaml
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErpSyncRunPage.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml
post:
  tags:
    - ERP sync
  summary: Start an ERP sync now
  description: >-
    Queues a sync of the caller's entity outside the 15-minute schedule (DF-31)
    and returns 202 with the run id (D-135). A second run for the same entity
    waits for the first. The sync stores purchase orders, receipts, service
    acceptances, suppliers, master data, unit conversions, the tax-risk list,
    and the authority statuses of unsent invoices; it rejects bad records with a
    reason (AC-07.4, AC-07.9, AC-07.12) and then re-checks invoices that wait
    for goods or are affected by a new risk-list entry (AC-07.6, AC-07.10,
    AC-07.11). No screen has a "Sync now" control: this call serves the demo and
    tests (D-154).
  operationId: startErpSync
  security:
    - sessionCookie: []
      csrfHeader: []
  x-roles:
    - AP_ACCOUNTANT
  x-stories:
    - US-07
  x-rules:
    - BR-08
    - BR-13
    - BR-14
    - BR-19
    - BR-25
    - BR-31
    - BR-39
  x-screens: []
  x-tables:
    - erp_sync_runs
    - erp_sync_rejections
    - erp_users
    - erp_suppliers
    - erp_supplier_bank_accounts
    - erp_items
    - erp_unit_conversions
    - erp_purchase_orders
    - erp_po_lines
    - erp_receipts
    - erp_receipt_lines
    - tax_risk_entries
    - authority_status_lookups
    - audit_log
  x-criteria:
    - AC-07.1
    - AC-07.2
    - AC-07.3
    - AC-07.4
    - AC-07.5
    - AC-07.6
    - AC-07.9
    - AC-07.10
    - AC-07.11
    - AC-07.12
    - AC-20.6
  responses:
    '202':
      description: Sync queued
      content:
        application/json:
          schema:
            $ref: ../components/schemas/JobAccepted.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml
    '503':
      $ref: ../components/responses/Unavailable.yaml

get:
  tags:
    - Service acceptance
  summary: List service invoices waiting for acceptance
  description: >-
    Service invoices of the own entity that are Waiting for Goods because the
    ERP holds no acceptance for their order (AC-29.1, DF-61). A goods invoice is
    never listed (AC-29.5) and an invoice leaves the queue once the ERP records
    an acceptance (AC-29.4). Computed from invoices, invoice_receipts, and
    service_acceptances (D-142).
  operationId: listAcceptanceQueue
  security:
    - sessionCookie: []
  x-roles:
    - REQUESTING_DEPARTMENT
  x-stories:
    - US-29
  x-rules:
    - BR-14
    - BR-19
  x-screens:
    - SCR-22
  x-tables:
    - invoices
    - invoice_receipts
    - service_acceptances
    - erp_purchase_orders
    - erp_po_lines
    - erp_suppliers
  x-criteria:
    - AC-29.1
    - AC-29.4
    - AC-29.5
  parameters:
    - name: supplierId
      in: query
      required: false
      description: One supplier.
      schema:
        $ref: ../components/schemas/Id.yaml
    - name: dueSoon
      in: query
      required: false
      description: Only invoices due within 7 days.
      schema:
        type: boolean
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AcceptanceQueueItemPage.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml

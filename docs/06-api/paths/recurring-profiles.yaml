get:
  tags:
    - Recurring profiles
  summary: List recurring profiles
  description: >-
    Lists the profiles of the own entity with supplier, location, period, price
    type, and status. Each profile lists the amounts of earlier periods and
    their average, which BR-24 uses (AC-09.4).
  operationId: listRecurringProfiles
  security:
    - sessionCookie: []
  x-roles:
    - AP_ACCOUNTANT
  x-stories:
    - US-09
  x-rules:
    - BR-24
  x-screens:
    - SCR-20
  x-tables:
    - recurring_profiles
    - recurring_profile_periods
    - erp_suppliers
  x-criteria:
    - AC-09.4
  parameters:
    - name: isActive
      in: query
      required: false
      description: Active or inactive profiles.
      schema:
        type: boolean
    - name: supplierId
      in: query
      required: false
      description: One supplier.
      schema:
        $ref: ../components/schemas/Id.yaml
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RecurringProfilePage.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml
post:
  tags:
    - Recurring profiles
  summary: Create a recurring profile
  description: >-
    A FIXED profile needs a contract price (AC-09.2). A second active profile of
    the same supplier, location, and period is refused with 422
    VALIDATION_FAILED (AC-09.3). Appends to audit_log.
  operationId: createRecurringProfile
  security:
    - sessionCookie: []
      csrfHeader: []
  x-roles:
    - AP_ACCOUNTANT
  x-stories:
    - US-09
  x-rules:
    - BR-24
  x-screens:
    - SCR-21
  x-tables:
    - recurring_profiles
    - erp_suppliers
    - audit_log
  x-criteria:
    - AC-09.1
    - AC-09.2
    - AC-09.3
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RecurringProfileInput.yaml
  responses:
    '201':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RecurringProfile.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml

patch:
  tags:
    - Group and entities
  summary: Set the group limits
  description: >-
    Sets the maximum price tolerance and the maximum batch threshold. Lowering a
    maximum below an entity value lowers that value in the same transaction, one
    audit entry each (AC-03.4, BR-16); the response lists every adjustment.
    Carries `version`.
  operationId: updateGroupLimits
  security:
    - sessionCookie: []
      csrfHeader: []
  x-roles:
    - GROUP_ADMIN
  x-stories:
    - US-03
  x-rules:
    - BR-16
  x-screens:
    - SCR-76
  x-tables:
    - corporate_groups
    - entity_policies
    - entities
    - audit_log
  x-criteria:
    - AC-03.3
    - AC-03.4
    - AC-03.5
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/GroupLimitsUpdate.yaml
        example:
          version: 2
          maxPriceTolerancePct: '5.00'
          maxBatchThresholdVnd: '300000000.00'
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/GroupLimitsResult.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml

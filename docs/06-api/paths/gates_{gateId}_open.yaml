post:
  tags:
    - Automation gates
  summary: Open a gate
  description: >-
    Opens the gate by hand (D-06; nothing opens by itself, AC-06.8, W-01). With
    fewer than 50 compared invoices it is refused: "At least 50 compared
    invoices are needed" (AC-06.4, DF-16). Below the threshold a written
    `reason` is required (AC-06.5). The opening, the accuracy, and the reason go
    to audit_log with the event type GATE_CHANGE. Carries `version`.
  operationId: openGate
  security:
    - sessionCookie: []
      csrfHeader: []
  x-roles:
    - GROUP_ADMIN
  x-stories:
    - US-06
  x-rules:
    - BR-06
  x-screens:
    - SCR-79
  x-tables:
    - supplier_gates
    - gate_comparisons
    - audit_log
  x-criteria:
    - AC-06.4
    - AC-06.5
    - AC-06.8
  parameters:
    - $ref: ../components/parameters/gateId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/GateOpenRequest.yaml
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Gate.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml

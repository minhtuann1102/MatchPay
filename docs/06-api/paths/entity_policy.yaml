get:
  tags:
    - Entity policy
  summary: Get the policy of the own entity
  description: >-
    Returns the tolerance, batch threshold, sample rate, and grouping mode of
    the caller's entity with the group maximums. The entity comes from the
    session (D-132); there is no entity in the path (AC-04.6).
  operationId: getEntityPolicy
  security:
    - sessionCookie: []
  x-roles:
    - ENTITY_ADMIN
  x-stories:
    - US-04
  x-rules:
    - BR-09
    - BR-16
  x-screens:
    - SCR-73
  x-tables:
    - entity_policies
    - corporate_groups
  x-criteria:
    - AC-04.6
    - AC-04.8
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/EntityPolicy.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml
put:
  tags:
    - Entity policy
  summary: Change the policy of the own entity
  description: >-
    Replaces the four values. A value above a group maximum gives 422
    RULE_LIMIT_EXCEEDED with "Maximum allowed by the group: 5%" and saves
    nothing (AC-04.2, BR-16). A sample rate outside 1 to 100 is refused
    (AC-04.3). New values apply to invoices checked afterwards; an invoice
    already In Batch stays (AC-04.5). The grouping mode decides one request per
    supplier or per invoice at release (AC-04.4, BR-20). Appends to audit_log
    with the old and new values (AC-04.7). Carries `version`.
  operationId: updateEntityPolicy
  security:
    - sessionCookie: []
      csrfHeader: []
  x-roles:
    - ENTITY_ADMIN
  x-stories:
    - US-04
  x-rules:
    - BR-04
    - BR-07
    - BR-12
    - BR-16
    - BR-20
  x-screens:
    - SCR-73
  x-tables:
    - entity_policies
    - corporate_groups
    - audit_log
  x-criteria:
    - AC-04.1
    - AC-04.2
    - AC-04.3
    - AC-04.4
    - AC-04.5
    - AC-04.7
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/EntityPolicyUpdate.yaml
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/EntityPolicy.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml

post:
  tags:
    - Exceptions
  summary: Correct the flow
  description: >-
    The AP Accountant chooses the flow when the AI was unsure (AC-12.4); the AI
    value stays in ai_flow_classifications (D-66). The flow "Unsupported:
    foreign invoice" cannot be chosen, and an invoice classified that way can
    only be rejected (AC-12.9). A run follows; 202.
  operationId: correctFlow
  security:
    - sessionCookie: []
      csrfHeader: []
  x-roles:
    - AP_ACCOUNTANT
  x-stories:
    - US-12
    - US-18
  x-rules:
    - BR-17
    - BR-23
    - BR-34
    - BR-37
  x-screens:
    - SCR-12
  x-tables:
    - exceptions
    - exception_reasons
    - invoices
    - ai_flow_classifications
    - invoice_check_runs
    - audit_log
  x-criteria:
    - AC-12.4
    - AC-12.6
    - AC-12.9
    - AC-18.3
  parameters:
    - $ref: ../components/parameters/exceptionId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CorrectFlowRequest.yaml
  responses:
    '202':
      description: Saved; check run queued
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ExceptionActionResult.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml

get:
  tags:
    - Automation gates
  summary: Get an automation gate
  description: >-
    Returns one pair with its counts, accuracy, and open alert. Counts only
    (BR-09).
  operationId: getGate
  security:
    - sessionCookie: []
  x-roles:
    - GROUP_ADMIN
  x-stories:
    - US-06
  x-rules:
    - BR-06
    - BR-09
  x-screens:
    - SCR-78
    - SCR-79
  x-tables:
    - supplier_gates
    - gate_comparisons
    - gate_alerts
    - erp_suppliers
    - entities
  x-criteria:
    - AC-06.1
    - AC-06.3
    - AC-06.9
  parameters:
    - $ref: ../components/parameters/gateId.yaml
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Gate.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml

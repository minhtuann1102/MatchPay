post:
  tags:
    - Exceptions
  summary: Confirm a line match
  description: >-
    Confirms that an invoice line is the named ERP item. The pair is stored in
    the mapping table of the own entity with the user and the time, and the next
    line with that text from that supplier matches without an LLM call (AC-18.2,
    D-52, G-07); another entity never uses it (AC-18.8). The resolved reason is
    closed and UC-16 runs again; the response is 202 with the check run
    (AC-18.3). Carries the exception `version` (BR-37, AC-18.7).
  operationId: confirmLineMatch
  security:
    - sessionCookie: []
      csrfHeader: []
  x-roles:
    - AP_ACCOUNTANT
  x-stories:
    - US-18
  x-rules:
    - BR-09
    - BR-28
    - BR-34
    - BR-37
  x-screens:
    - SCR-12
  x-tables:
    - exceptions
    - exception_reasons
    - item_mappings
    - invoice_line_matches
    - invoice_lines
    - erp_items
    - invoice_check_runs
    - audit_log
  x-criteria:
    - AC-18.2
    - AC-18.3
    - AC-18.7
    - AC-18.8
  parameters:
    - $ref: ../components/parameters/exceptionId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ConfirmLineMatchRequest.yaml
  responses:
    '202':
      description: Saved; check run queued
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ExceptionActionResult.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/Unprocessable.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml

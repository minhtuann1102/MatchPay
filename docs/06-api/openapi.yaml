  /invoices/uploads:
    post:
      tags:
      - Invoices
      summary: Upload XML invoices
      description: 'Multipart upload of one or many XML files (D-141; at most 20 files of 10 MB each, DF-85). Each
        file is processed on its own, so a failing file never stops the others (AC-10.10). For every file the server
        stores the original unchanged with its SHA-256, checks the seller signature, the schema version, the buyer
        tax code against the entity, the group-wide exact-duplicate key, and the simulated tax-authority status
        (waits at most 10 seconds, DF-64), and sets the trust level (BR-17, BR-01, BR-11, BR-39). The result list
        tells each file: ACCEPTED (state Received, check run queued), REJECTED_INVOICE (stored as Rejected, original
        kept as evidence), or REJECTED_FILE (a PDF, an image, or any non-XML file: "Only XML e-invoices are accepted
        in the MVP", no invoice is created, AC-10.8). A duplicate in any entity says only that it exists (AC-10.7,
        BR-09). An adjustment or replacement invoice is linked to its original and goes to a person (AC-10.9, BR-31).
        An authority lookup that does not answer leaves the invoice an exception "Authority status unavailable"
        (AC-10.15). The AI checks and the Rule Engine run as a job after the response (UC-12..UC-16, D-135), so
        the response is 202. A request with no file part, or with more files than the limit, gives 422 FILE_REJECTED.
        Appends to audit_log.'
      operationId: uploadInvoices
      security:
      - sessionCookie: []
        csrfHeader: []
      x-roles:
      - AP_ACCOUNTANT
      x-stories:
      - US-10
      x-rules:
      - BR-01
      - BR-09
      - BR-11
      - BR-12
      - BR-17
      - BR-31
      - BR-33
      - BR-39
      x-screens:
      - SCR-11
      - SCR-10
      x-tables:
      - invoices
      - invoice_documents
      - invoice_lines
      - invoice_corrections
      - erp_suppliers
      - group_sectors
      - authority_status_lookups
      - invoice_check_runs
      - audit_log
      x-criteria:
      - AC-10.1
      - AC-10.2
      - AC-10.3
      - AC-10.4
      - AC-10.5
      - AC-10.6
      - AC-10.7
      - AC-10.8
      - AC-10.9
      - AC-10.10
      - AC-10.11
      - AC-10.12
      - AC-10.13
      - AC-10.14
      - AC-10.15
      - AC-10.16
      - AC-13.5
      - AC-15.2
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadForm'
      responses:
        '202':
          description: Files processed; check runs queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
              example:
                acceptedCount: 1
                rejectedCount: 2
                items:
                - fileName: C26TAA-0000123.xml
                  outcome: ACCEPTED
                  invoiceId: 1042
                  invoiceNumber: C26TAA-0000123
                  state: RECEIVED
                  message: Accepted
                  warnings: []
                  checkRunId: 7301
                - fileName: scan.pdf
                  outcome: REJECTED_FILE
                  fileRejectionReason: NOT_XML
                  message: Only XML e-invoices are accepted in the MVP
                  warnings: []
                - fileName: C26TAA-0000140.xml
                  outcome: REJECTED_INVOICE
                  invoiceId: 1043
                  invoiceNumber: C26TAA-0000140
                  state: REJECTED
                  rejectionReason: CANCELLED_AT_AUTHORITY
                  message: Cancelled at the tax authority on 2026-11-03
                  warnings: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

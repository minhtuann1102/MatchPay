      - series
      - number
      - invoiceNumber
      - sellerName
      - totalAmount
      - dueSoon
      - state
      - source
      - invoiceKind
      - replyDue
      - receivedAt
      - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        series:
          type: string

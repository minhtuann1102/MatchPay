components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mp_session
      description: >-
        Opaque session id set by login (HttpOnly, Secure, SameSite=Strict). The
        session is kept on the server (D-131).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Value returned by login and getSession. Required on every state-changing
        request (D-131).

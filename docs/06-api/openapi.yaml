    post:
      tags:
      - ERP send
      summary: Resend a signed request to the ERP
      description: Offered after the 3 automatic attempts failed (D-96, AC-26.10). Allowed only for a request that
        is Signed, with no attempt pending; otherwise 409 STATE_CONFLICT (while attempts run, after a payment failure,
        or for any other state, AC-26.13). Uses the request number as the idempotency key, asks for no new signature,
        checks the hash of the signed content first (AC-26.7), and saves the attempt as manual with the name and
        the time (AC-26.11). A repeat never creates a second payment (AC-26.12, BR-25). Returns 202 with the queued
        attempt (D-135). Accepts `Idempotency-Key` (D-137). A Payment Approver or a user of another entity gets
        403 (AC-26.14). Appends to audit_log.

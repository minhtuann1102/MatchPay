            schema:
              $ref: '#/components/schemas/SimPurchaseOrderCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimPurchaseOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /demo/erp-simulator/purchase-orders/{poId}:
    get:
      tags:
      - Demo
      summary: Get a simulator purchase order
      description: 'Disabled outside a demo deployment: the server answers 404 RESOURCE_NOT_FOUND when the demo
        flag is off (D-143). Demo Operator only (AC-08.7); every other role gets 403. One order with its lines and
        received quantities.'
      operationId: getSimPurchaseOrder
      security:
      - sessionCookie: []
      x-roles:
      - DEMO_OPERATOR
      x-stories:
      - US-08
      x-rules:
      - BR-15
      x-screens:
      - SCR-80
      - SCR-82
      x-tables:
      - sim_purchase_orders
      - sim_po_lines
      - sim_receipt_lines
      - sim_personas
      x-criteria:
      - AC-08.5
      parameters:
      - $ref: '#/components/parameters/poId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimPurchaseOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /demo/erp-simulator/receipts:
    get:
      tags:
      - Demo
      summary: List simulator receipts and acceptances
      description: 'Disabled outside a demo deployment: the server answers 404 RESOURCE_NOT_FOUND when the demo
        flag is off (D-143). Demo Operator only (AC-08.7); every other role gets 403. Receipts and service acceptances
        of the entity (SCR-80).'
      operationId: listSimReceipts
      security:
      - sessionCookie: []
      x-roles:
      - DEMO_OPERATOR
      x-stories:
      - US-08
      x-rules:
      - BR-09
      x-screens:
      - SCR-80
      x-tables:
      - sim_receipts
      - sim_receipt_lines
      - sim_purchase_orders
      - sim_personas
      x-criteria:
      - AC-08.2
      - AC-08.6
      - AC-08.8
      parameters:
      - name: entityId
        in: query
        required: true
        description: The entity the Demo Operator works in.
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimReceiptPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Demo
      summary: Confirm a simulator receipt or acceptance
      description: 'Disabled outside a demo deployment: the server answers 404 RESOURCE_NOT_FOUND when the demo
        flag is off (D-143). Demo Operator only (AC-08.7); every other role gets 403. Stores a receipt (goods) or
        an acceptance (service) with a reference to the order (AC-08.2, AC-08.6, BR-13, BR-19). A receipt without
        an order reference is rejected (AC-08.4). The same persona that created the order is refused with 403 SEPARATION_OF_DUTIES
        "The receipt must be confirmed by a different person than the order creator" (AC-08.3, BR-02). A partial
        quantity leaves the order open (AC-08.5, BR-15).'
      operationId: confirmSimReceipt
      security:
      - sessionCookie: []
        csrfHeader: []
      x-roles:
      - DEMO_OPERATOR
      x-stories:
      - US-08
      x-rules:
      - BR-02
      - BR-13
      - BR-15
      - BR-19
      x-screens:
      - SCR-82
      - SCR-80
      x-tables:
      - sim_receipts
      - sim_receipt_lines
      - sim_purchase_orders
      - sim_po_lines
      - sim_personas
      - entities
      x-criteria:
      - AC-08.2
      - AC-08.3
      - AC-08.4
      - AC-08.5
      - AC-08.6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimReceiptCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenSod'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mp_session
      description: Opaque session id set by login (HttpOnly, Secure, SameSite=Strict). The session is kept on the
        server (D-131).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Value returned by login and getSession. Required on every state-changing request (D-131).
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: One-based page number (D-140).
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Items per page (D-140, DF-83). The worklist client sends 50 (DF-68).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A UUID chosen by the client for this action. A repeat with the same key returns the first result
        and does nothing twice (D-137, DF-87).
      schema:
        type: string
        format: uuid
    batchId:
      name: batchId
      in: path
      required: true
      description: Identifier of a payment batch of the caller's entity.
      schema:
        $ref: '#/components/schemas/Id'
    correctionRequestId:
      name: correctionRequestId
      in: path
      required: true
      description: Identifier of a correction request or data-fix notice.
      schema:
        $ref: '#/components/schemas/Id'
    delegationId:
      name: delegationId
      in: path
      required: true
      description: Identifier of a signing delegation of the caller's entity.
      schema:
        $ref: '#/components/schemas/Id'
    entryId:
      name: entryId
      in: path
      required: true
      description: Identifier of an audit log entry.
      schema:
        $ref: '#/components/schemas/Id'
    exceptionId:
      name: exceptionId
      in: path
      required: true
      description: Identifier of an exception of the caller's entity.
      schema:
        $ref: '#/components/schemas/Id'
    figure:
      name: figure
      in: path
      required: true
      description: The dashboard figure whose invoices are listed.
      schema:
        $ref: '#/components/schemas/DashboardFigure'
    followUpInvoiceId:
      name: followUpInvoiceId
      in: path
      required: true
      description: Identifier of the follow-up invoice.
      schema:
        $ref: '#/components/schemas/Id'
    gateId:
      name: gateId
      in: path
      required: true
      description: Identifier of an automation gate (a supplier and entity pair).
      schema:
        $ref: '#/components/schemas/Id'
    invoiceId:
      name: invoiceId
      in: path
      required: true
      description: Identifier of an invoice. An id outside the caller's entity scope gives 403 ACCESS_DENIED (D-132).
      schema:
        $ref: '#/components/schemas/Id'
    lineId:
      name: lineId
      in: path
      required: true
      description: Identifier of a payment request line.
      schema:
        $ref: '#/components/schemas/Id'
    messageId:
      name: messageId
      in: path
      required: true
      description: Identifier of a mailbox message of the caller's entity.
      schema:
        $ref: '#/components/schemas/Id'
    noticeId:
      name: noticeId
      in: path
      required: true
      description: Identifier of a stored cancellation notice.
      schema:
        $ref: '#/components/schemas/Id'
    notificationId:
      name: notificationId
      in: path
      required: true
      description: Identifier of a notification addressed to the caller.
      schema:
        $ref: '#/components/schemas/Id'
    poId:
      name: poId
      in: path
      required: true
      description: Identifier of a simulator purchase order.
      schema:
        $ref: '#/components/schemas/Id'
    profileId:
      name: profileId
      in: path
      required: true
      description: Identifier of a recurring profile of the caller's entity.
      schema:
        $ref: '#/components/schemas/Id'
    requestId:
      name: requestId
      in: path
      required: true
      description: Identifier of a payment request of the caller's entity.
      schema:
        $ref: '#/components/schemas/Id'
    runId:
      name: runId
      in: path
      required: true
      description: Identifier of a run (sync, fetch, or check run).
      schema:
        $ref: '#/components/schemas/Id'
    sampleItemId:
      name: sampleItemId
      in: path
      required: true
      description: Identifier of a sample item of the batch.
      schema:
        $ref: '#/components/schemas/Id'
    sectorId:
      name: sectorId
      in: path
      required: true
      description: Identifier of a sector list entry.
      schema:
        $ref: '#/components/schemas/Id'
    userId:
      name: userId
      in: path
      required: true
      description: Identifier of a user in the caller's scope.
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    Unauthorized:
      description: No session, or the session ended. A deactivated user's session ends on the next request (AC-02.5).
        A wrong password at signing also gives 401 AUTH_INVALID_CREDENTIALS; the client tells them apart by errorCode.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            sessionExpired:
              value:
                type: https://matchpay.example/problems/auth-session-expired
                title: Session expired
                status: 401
                detail: The session has ended. Log in again.
                errorCode: AUTH_SESSION_EXPIRED
                traceId: 4f1c9a6e8b2d47a0
    InvalidCredentials:
      description: Wrong email or password. The response never says which (AC-01.2).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidCredentials:
              value:
                type: https://matchpay.example/problems/auth-invalid-credentials
                title: Invalid credentials
                status: 401
                detail: Email or password is incorrect
                errorCode: AUTH_INVALID_CREDENTIALS
                traceId: 4f1c9a6e8b2d47a0
    AccountDeactivated:
      description: The account is deactivated (AC-01.3).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            deactivated:
              value:
                type: https://matchpay.example/problems/auth-account-deactivated
                title: Account deactivated
                status: 403
                detail: Your account is deactivated. Please contact your administrator.
                errorCode: AUTH_ACCOUNT_DEACTIVATED
                traceId: 4f1c9a6e8b2d47a0
    Forbidden:
      description: The role may not call this operation, the record is outside the caller's entity scope, or the
        CSRF token is missing. No data is returned and nothing shows whether the record exists (D-132, AC-01.5,
        AC-01.8). The refusal is written to the audit log.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            accessDenied:
              value:
                type: https://matchpay.example/problems/access-denied
                title: Access denied
                status: 403
                detail: Access denied
                errorCode: ACCESS_DENIED
                traceId: 4f1c9a6e8b2d47a0
    ForbiddenSod:
      description: Access denied, or the actor may not act because of separation of duties (BR-02, BR-36). `context.invoiceId`
        names the invoice that causes it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            accessDenied:
              value:
                type: https://matchpay.example/problems/access-denied
                title: Access denied
                status: 403
                detail: Access denied
                errorCode: ACCESS_DENIED
                traceId: 4f1c9a6e8b2d47a0
            separation:
              value:
                type: https://matchpay.example/problems/separation-of-duties
                title: Separation of duties
                status: 403
                detail: You processed an invoice in this request
                errorCode: SEPARATION_OF_DUTIES
                traceId: 4f1c9a6e8b2d47a0
                context:
                  invoiceId: 1042
                  invoiceNumber: C26TAA-0000123
                  blockCode: PROCESSED_INVOICE
    NotFound:
      description: The resource does not exist. Used only for unscoped lookups such as the demo routes when the
        demo flag is off (D-139, D-143); an id outside the caller's scope gives 403 instead.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              value:
                type: https://matchpay.example/problems/resource-not-found
                title: Not found
                status: 404
                detail: No such resource
                errorCode: RESOURCE_NOT_FOUND
                traceId: 4f1c9a6e8b2d47a0
    Conflict:
      description: The record changed since the caller read it (VERSION_CONFLICT, with the current record in `current`),
        or the transition is not allowed from the current state (STATE_CONFLICT, BR-33, BR-34, BR-35). Nothing was
        saved (BR-37).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            versionConflict:
              value:
                type: https://matchpay.example/problems/version-conflict
                title: Version conflict
                status: 409
                detail: The record was changed by someone else. Reload and try again.
                errorCode: VERSION_CONFLICT
                traceId: 4f1c9a6e8b2d47a0
                current:
                  id: 2201
                  version: 3
            stateConflict:
              value:
                type: https://matchpay.example/problems/state-conflict
                title: State conflict
                status: 409
                detail: 'BR-35 B7: a request in this batch is already signed'
                errorCode: STATE_CONFLICT
                traceId: 4f1c9a6e8b2d47a0
    Unprocessable:
      description: The body or query is invalid (VALIDATION_FAILED, with `errors`), a group limit is exceeded (RULE_LIMIT_EXCEEDED,
        BR-16), or a file is refused (FILE_REJECTED).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              value:
                type: https://matchpay.example/problems/validation-failed
                title: Validation failed
                status: 422
                detail: One or more fields are invalid
                errorCode: VALIDATION_FAILED
                traceId: 4f1c9a6e8b2d47a0
                errors:
                  email:
                  - Email already in use
            limit:
              value:
                type: https://matchpay.example/problems/rule-limit-exceeded
                title: Group limit exceeded
                status: 422
                detail: 'Maximum allowed by the group: 5%'
                errorCode: RULE_LIMIT_EXCEEDED
                traceId: 4f1c9a6e8b2d47a0
                errors:
                  priceTolerancePct:
                  - 'Maximum allowed by the group: 5%'
            file:
              value:
                type: https://matchpay.example/problems/file-rejected
                title: File rejected
                status: 422
                detail: The upload has no file part
                errorCode: FILE_REJECTED
                traceId: 4f1c9a6e8b2d47a0
                rejectionReason: NO_FILE_PART
    TooManyRequests:
      description: Too many requests (DF-88). `Retry-After` gives the seconds.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rateLimited:
              value:
                type: https://matchpay.example/problems/rate-limited
                title: Too many requests
                status: 429
                detail: Try again later
                errorCode: RATE_LIMITED
                traceId: 4f1c9a6e8b2d47a0
                retryAfterSeconds: 30
    Unavailable:
      description: 'A dependency does not answer: the ERP, the mailbox, the status lookup, the Email Service, or
        the LLM. Earlier data stays (D-139).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            dependency:
              value:
                type: https://matchpay.example/problems/dependency-unavailable
                title: Dependency unavailable
                status: 503
                detail: The tax-authority status lookup did not answer within 10 seconds
                errorCode: DEPENDENCY_UNAVAILABLE
                traceId: 4f1c9a6e8b2d47a0
    InternalError:
      description: Unexpected server error. If an audit entry cannot be written the action does not complete and
        this is returned (DF-30, AC-28.7).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              value:
                type: https://matchpay.example/problems/internal-error
                title: Internal error
                status: 500
                detail: Unexpected error
                errorCode: INTERNAL_ERROR
                traceId: 4f1c9a6e8b2d47a0
  schemas:
    AcceptanceDecision:
      type: string
      description: Same values as the DBML enum `acceptance_decision`.
      enum:
      - CONFIRMED
      - REJECTED
      x-dbml-enum: acceptance_decision
    AcceptanceDecisionRequest:
      type: object
      description: Confirm or reject the acceptance of a service.
      required:
      - decision
      - version
      properties:
        decision:
          $ref: '#/components/schemas/AcceptanceDecision'
        note:
          type: string
          description: Required to reject (AC-29.3).
        version:
          allOf:
          - $ref: '#/components/schemas/Version'
          description: Version of the invoice last read (BR-37).
      example:
        decision: CONFIRMED
        note: Cleaning done 3 to 7 Nov, signed off on site
        version: 2
    AcceptanceDecisionResult:
      type: object
      description: The saved acceptance and the re-check that started.
      required:
      - acceptance
      - invoice
      - checkRunId
      properties:
        acceptance:
          $ref: '#/components/schemas/ServiceAcceptanceRecord'
        invoice:
          $ref: '#/components/schemas/InvoiceBrief'
        checkRunId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: UC-16 runs again in the same action (AC-29.2).
    AcceptanceQueueItem:
      type: object
      description: A service invoice that waits for goods with no ERP acceptance (SCR-22).
      required:
      - invoiceId
      - invoiceNumber
      - supplierName
      - orderId
      - orderErpRef
      - serviceLines
      - totalAmount
      - dueSoon
      - invoiceVersion
      properties:
        invoiceId:
          $ref: '#/components/schemas/Id'
        invoiceNumber:
          type: string
        supplierName:
          type: string
        orderId:
          $ref: '#/components/schemas/Id'
        orderErpRef:
          type: string
        serviceLines:
          type: array
          items:
            $ref: '#/components/schemas/ServiceLine'
        totalAmount:
          $ref: '#/components/schemas/Money'
        dueDate:
          type: string
          format: date
          nullable: true
        dueSoon:
          type: boolean
        invoiceVersion:
          $ref: '#/components/schemas/Version'
        blocked:
          type: object
          allOf:
          - $ref: '#/components/schemas/SignBlock'
          nullable: true
          description: Set when the caller created the order (AC-29.6).
      example:
        invoiceId: 1050
        invoiceNumber: C26TAA-0000150
        supplierName: Lakeside Facility Services Ltd
        orderId: 910
        orderErpRef: PO-CF-1020
        totalAmount: '12000000.00'
        dueDate: '2026-11-14'
        dueSoon: false
        invoiceVersion: 2
        serviceLines:
        - description: Cleaning, 5 days
          quantity: '5.000'
          unit: day
          unitPrice: '2400000.00'
    AcceptanceQueueItemPage:
      type: object
      description: One page of AcceptanceQueueItem records.
      required:
      - items
      - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AcceptanceQueueItem'
        meta:
          $ref: '#/components/schemas/PageMeta'
    AcceptanceSource:
      type: string
      description: Where an independent service acceptance came from (BR-19, D-90).
      enum:
      - ERP
      - REQUESTING_DEPARTMENT
    AdmittedVia:
      type: string
      description: Same values as the DBML enum `admitted_via`.
      enum:
      - RULE_ENGINE
      - INDIVIDUAL_APPROVAL
      x-dbml-enum: admitted_via
    AgeBucket:
      type: string
      description: Age of an open exception (AC-27.3).
      enum:
      - DAYS_0_2
      - DAYS_3_7
      - OVER_7
    AiCallKind:
      type: string
      description: Same values as the DBML enum `ai_call_kind`.
      enum:
      - EMBEDDING
      - LLM
      x-dbml-enum: ai_call_kind
    AiOutcome:
      type: string
      description: Same values as the DBML enum `ai_outcome`.
      enum:
      - SUCCESS
      - INVALID_OUTPUT
      - TIMEOUT
      - ERROR
      x-dbml-enum: ai_outcome
    AiPaymentSummary:
      type: object
      description: AI summary of a request. It is never a signature (BR-20, AC-25.9).
      required:
      - available
      - aiGenerated
      properties:
        available:
          type: boolean
        summaryText:
          type: string
          nullable: true
          description: AI text, to be labelled as AI. NULL when unavailable (AC-25.13).
        outcome:
          type: string
          allOf:
          - $ref: '#/components/schemas/AiOutcome'
          nullable: true
        requestVersion:
          type: integer
          nullable: true
        generatedAt:
          type: string
          format: date-time
          nullable: true
        modelVersion:
          type: string
          nullable: true
        promptVersion:
          type: string
          nullable: true
        aiGenerated:
          type: boolean
    AiRequestRecord:
      type: object
      description: One embedding or LLM call of the run. No document text is stored (D-59).
      required:
      - task
      - callKind
      - modelVersion
      - promptVersion
      - outcome
      - requestedAt
      properties:
        task:
          $ref: '#/components/schemas/AiTask'
        callKind:
          $ref: '#/components/schemas/AiCallKind'
        modelVersion:
          type: string
        promptVersion:
          type: string
        outcome:
          $ref: '#/components/schemas/AiOutcome'
        latencyMs:
          type: integer
          nullable: true
        requestedAt:
          type: string
          format: date-time
    AiTask:
      type: string
      description: Same values as the DBML enum `ai_task`.
      enum:
      - CLASSIFY_FLOW
      - IDENTIFY
      - MATCH_LINES
      - DETECT_ANOMALIES
      - DRAFT_REQUEST
      - SELECT_SAMPLE
      - SUMMARIZE_BATCH
      x-dbml-enum: ai_task
    AnomalyFinding:
      type: object
      description: One anomaly check result with the numbers behind it (AC-15.9). Related invoices are those of
        the same entity only (BR-09).
      required:
      - id
      - kind
      - result
      - relatedInvoiceIds
      - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          $ref: '#/components/schemas/AnomalyKind'
        result:
          $ref: '#/components/schemas/AnomalyResult'
        observedValue:
          type: string
          allOf:
          - $ref: '#/components/schemas/Decimal'
          nullable: true
        referenceValue:
          type: string
          allOf:
          - $ref: '#/components/schemas/Decimal'
          nullable: true
        deviationPct:
          type: string
          allOf:
          - $ref: '#/components/schemas/Decimal'
          nullable: true
        limitPct:
          type: string
          allOf:
          - $ref: '#/components/schemas/Decimal'
          nullable: true
        sampleCount:
          type: integer
          nullable: true
        windowDays:
          type: integer
          nullable: true
        combinedAmount:
          type: string
          allOf:

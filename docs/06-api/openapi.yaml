          type: string
        invoiceNumber:
          type: string
          description: Series and number, for example C26TAA-0000123.
        sellerName:
          type: string
        supplierId:
          type: integer
          allOf:
          - $ref: '#/components/schemas/Id'
          nullable: true
        flow:
          type: string
          allOf:
          - $ref: '#/components/schemas/InvoiceFlow'
          nullable: true
        totalAmount:
          $ref: '#/components/schemas/Money'
        invoiceDate:
          type: string
          format: date
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        dueSoon:
          type: boolean
          description: Due within 7 days and not final (DF-18). Computed.
        state:
          $ref: '#/components/schemas/InvoiceState'
        source:
          $ref: '#/components/schemas/InvoiceSource'
        invoiceKind:
          $ref: '#/components/schemas/InvoiceKind'
        openExceptionId:
          type: integer
          allOf:
          - $ref: '#/components/schemas/Id'
          nullable: true
        replyDue:
          type: boolean

openapi: 3.0.4
info:
  title: MatchPay API
  version: 1.0.0
  description: >-
    REST API contract of MatchPay for its web application: AI reads and matches
    incoming invoices, a Rule Engine admits clean ones to a payment batch, and
    authorised people sign consolidated payment requests for the legal entities
    of a group.


    The contract is the source of truth for paths, request and response bodies,
    roles, and errors (D-130). The server enforces entity scope and roles on
    every request; hidden controls in the interface are for convenience only
    (D-133).


    Every operation carries the extensions `x-roles`, `x-stories`, `x-rules`,
    `x-screens`, and `x-tables` (D-134) that link it to the user stories,
    business rules, screens, and database tables of the requirements,
    information architecture, UI/UX, and database documents.


    All sample data is fictional (Calderwood Group). This is a draft for review.
  contact:
    name: MatchPay documentation team
servers:
  - url: /api/v1
    description: Version 1 relative to the deployment host
tags:
  - name: Session
    description: >-
      Login, logout, and the current session. A server-side session behind an
      HttpOnly cookie (D-131).
  - name: Users
    description: Create, change, and deactivate users; link them to ERP users (US-02).
  - name: Group and entities
    description: The group limits, the sector list, and the entities of the group (US-03).
  - name: Entity policy
    description: >-
      Tolerance, batch threshold, sample rate, and grouping mode of one entity
      (US-04).
  - name: Approval matrix
    description: Amount tiers and approvers of one entity (US-05).
  - name: Delegations
    description: Signing delegations for an absence (US-30, BR-38).
  - name: Automation gates
    description: >-
      Shadow-mode accuracy and the manual gate switch per supplier and entity
      pair (US-06, BR-06).
  - name: ERP sync
    description: >-
      Read-only copy of ERP data: sync runs, rejections, suppliers, items
      (US-07).
  - name: Recurring profiles
    description: >-
      References for electricity, water, rent, and fixed-price subscriptions
      (US-09).
  - name: Invoices
    description: >-
      Intake, worklist, search, detail, original document, lines, and history
      (US-10, US-17).
  - name: Mailbox
    description: The simulated invoice mailbox of an entity (US-31).
  - name: Checks and evidence
    description: >-
      AI and Rule Engine results of check runs, the evidence of an invoice,
      re-runs, and the authority status (US-12 to US-16).
  - name: Exceptions
    description: >-
      The exception list, detail, decision queue, and the resolution actions
      (US-18).
  - name: Corrections and follow-ups
    description: >-
      Correction requests, data-fix notices, follow-up invoices, and
      cancellation notices (US-19, US-20, US-18).
  - name: Tax-risk decisions
    description: The Chief Accountant releases or rejects a tax-risk hold (US-21).
  - name: Individual approvals
    description: The Payment Approver approves or declines one exception (US-23).
  - name: Service acceptance
    description: >-
      The Requesting Department confirms or rejects the acceptance of a service
      (US-29).
  - name: Batch
    description: >-
      The period batch, the sample check, release, reopening, and withdrawal
      (US-24).
  - name: Signing
    description: >-
      The signing queue, the request detail, signing in one action, and line
      removal or decline (US-25, US-30).
  - name: ERP send
    description: Send attempts to the Entity ERP and the manual resend (US-26).
  - name: Notifications
    description: In-app notifications and reminders (US-32).
  - name: Dashboard and group overview
    description: >-
      Touchless rate, misplacement rate, backlog, and the group overview (US-27,
      US-06, US-07).
  - name: Audit log
    description: The append-only audit log, read-only (US-28).
  - name: Demo
    description: >-
      The ERP simulator of the demo deployment. Demo Operator only; disabled
      outside a demo (US-08, D-143).
security:
  - sessionCookie: []

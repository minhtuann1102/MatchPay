    UploadItemResult:
      type: object
      description: The result of one file of an upload (SCR-11). A failing file never stops the others (AC-10.10).
      required:
      - fileName
      - outcome
      - message
      - warnings
      properties:
        fileName:
          type: string
        outcome:
          $ref: '#/components/schemas/UploadFileOutcome'
        invoiceId:
          $ref: '#/components/schemas/Id'
        invoiceNumber:
          type: string
        state:
          $ref: '#/components/schemas/InvoiceState'
        rejectionReason:
          $ref: '#/components/schemas/RejectionReason'
        fileRejectionReason:
          $ref: '#/components/schemas/FileRejectionReason'
        message:
          type: string
          description: Text for the result list, for example "Cancelled at the tax authority on 2026-11-03".
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        checkRunId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: Check run started for an accepted invoice (D-135).
    UploadResult:
      type: object
      description: Per-file results of an upload or a fetch.
      required:
      - items
      - acceptedCount
      - rejectedCount
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UploadItemResult'
        acceptedCount:
          type: integer
        rejectedCount:
          type: integer
      example:
        acceptedCount: 1
        rejectedCount: 2
        items:
        - fileName: C26TAA-0000123.xml
          outcome: ACCEPTED
          invoiceId: 1042
          invoiceNumber: C26TAA-0000123
          state: RECEIVED
          message: Accepted
          warnings: []
          checkRunId: 7301
        - fileName: scan.pdf
          outcome: REJECTED_FILE
          fileRejectionReason: NOT_XML
          message: Only XML e-invoices are accepted in the MVP
          warnings: []
        - fileName: C26TAA-0000140.xml
          outcome: REJECTED_INVOICE
          invoiceId: 1043
          invoiceNumber: C26TAA-0000140
          state: REJECTED
          rejectionReason: CANCELLED_AT_AUTHORITY
          message: Cancelled at the tax authority on 2026-11-03
          warnings: []
    User:
      type: object
      description: A user account. The password hash is never returned.
      required:
      - id
      - groupId
      - email
      - fullName
      - role
      - status
      - createdAt
      - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        groupId:
          $ref: '#/components/schemas/Id'
        entityId:
          type: integer
          allOf:
          - $ref: '#/components/schemas/Id'
          nullable: true
        entityName:
          type: string
          nullable: true
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        erpUser:
          type: object
          allOf:
          - $ref: '#/components/schemas/ErpUserRef'
          nullable: true
        deactivatedAt:
          type: string
          format: date-time
          nullable: true
        deactivatedBy:
          type: integer
          allOf:
          - $ref: '#/components/schemas/Id'
          nullable: true
        createdAt:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/Version'
    UserCreate:
      type: object
      description: Create a user (AC-02.1, AC-02.2).
      required:
      - fullName
      - email
      - password
      - role
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          description: At least 8 characters (DF-32).
        role:
          $ref: '#/components/schemas/UserRole'
        entityId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: 'Group Admin only: the entity of the new user. Ignored and forced to the own entity for an
            Entity Admin. Omitted for the Group Admin and Demo Operator roles, who belong to the group.'
        erpUserId:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: ERP user to link (AC-02.4).
      example:
        fullName: Rowan
        email: rowan@calderwood-foods.example
        password: InitialPass#2026
        role: REQUESTING_DEPARTMENT
        entityId: 1
    UserPage:
      type: object
      description: One page of User records.
      required:
      - items
      - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/PageMeta'
    UserRole:
      type: string
      description: Same values as the DBML enum `user_role`.
      enum:
      - AP_ACCOUNTANT
      - CHIEF_ACCOUNTANT
      - PAYMENT_APPROVER
      - REQUESTING_DEPARTMENT
      - ENTITY_ADMIN
      - GROUP_ADMIN
      - DEMO_OPERATOR
      x-dbml-enum: user_role
    UserStatus:
      type: string
      description: Same values as the DBML enum `user_status`.
      enum:
      - ACTIVE
      - DEACTIVATED
      x-dbml-enum: user_status
    UserUpdate:
      type: object
      description: Change a user. An administrator cannot change their own role (AC-02.8). A user keeps one role
        in one entity (D-13).
      required:
      - version
      properties:
        version:
          $ref: '#/components/schemas/Version'
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        erpUserId:
          type: integer
          allOf:
          - $ref: '#/components/schemas/Id'
          nullable: true
          description: Set to null to remove the link.
    Version:
      type: integer
      minimum: 1
      description: Optimistic-concurrency version of a record (BR-37, D-136). Send the value last read.
      example: 3
    VersionOnly:
      type: object
      description: Carries only the version last read.
      required:
      - version
      properties:
        version:
          $ref: '#/components/schemas/Version'
      example:
        version: 3
    Warning:
      type: object
      description: A warning shown on the evidence; it never blocks.
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/WarningCode'
        message:
          type: string
    WarningCode:
      type: string
      description: Kinds of warning.
      enum:
      - BUYER_NAME_DIFFERS
      - AUTHORITY_ADJUSTED
      - CANCELLATION_NOTICE_STORED
      - SIMULATED_HISTORY
      - LAST_SYNC_FAILED
      - DUPLICATE_EXISTS_ELSEWHERE
      - SUMMARY_UNAVAILABLE
      - SAMPLE_WITHOUT_AI
      - DELEGATION_ACTIVE
    WithdrawReason:
      type: string
      description: Same values as the DBML enum `withdraw_reason`.
      enum:
      - SAMPLE_ERROR
      - WITHDRAWN_BY_AP
      - REMOVED_BY_SIGNER
      - REQUEST_DECLINED
      - RISK_LIST_CHANGE
      - CANCELLATION_NOTICE
      - REQUEST_CANCELLED
      - BATCH_REOPENED
      x-dbml-enum: withdraw_reason
    WithdrawRequest:
      type: object
      description: Withdraw an invoice from its batch (AC-24.7).
      required:
      - reason
      - version
      properties:
        reason:
          type: string
        version:
          allOf:
          - $ref: '#/components/schemas/Version'
          description: Version of the invoice last read.
      example:
        reason: Supplier asked to hold this invoice
        version: 6
    WithdrawResult:
      type: object
      description: The invoice back in exceptions and the request that changed.
      required:
      - invoice
      - exceptionId
      - batch
      properties:
        invoice:
          $ref: '#/components/schemas/InvoiceBrief'
        exceptionId:
          $ref: '#/components/schemas/Id'
        batch:
          $ref: '#/components/schemas/Batch'
        recomputedRequestId:
          $ref: '#/components/schemas/Id'
    WorklistSummary:
      type: object
      description: Header figures of the worklist, computed from invoices and erp_sync_runs (D-142).
      required:
      - openExceptionCount
      - waitingForGoodsCount
      - dueSoonCount
      - replyDueCount
      - countsByState
      - erpSync
      properties:
        openExceptionCount:
          type: integer
          description: Badge of open exceptions (AC-17.1).
        waitingForGoodsCount:
          type: integer
        dueSoonCount:
          type: integer
        replyDueCount:
          type: integer
        countsByState:
          type: object
          additionalProperties:
            type: integer
          description: Invoice count for each state name.
        erpSync:
          $ref: '#/components/schemas/ErpSyncStatus'
      example:
        openExceptionCount: 7
        waitingForGoodsCount: 2
        dueSoonCount: 3
        replyDueCount: 1
        countsByState:
          IN_BATCH: 5
          EXCEPTION: 7
        erpSync:
          lastSuccessAt: '2026-10-31T09:15:12+07:00'
          isStale: false
    WrongEntityReport:
      type: object
      description: A wrong-entity report with the traced source of the mismatch (D-68). The invoice never moves.
      required:
      - id
      - reportedBy
      - reportedAt
      - note
      - tracedSource
      properties:
        id:
          $ref: '#/components/schemas/Id'
        reportedBy:
          $ref: '#/components/schemas/Id'
        reportedAt:
          type: string
          format: date-time
        note:
          type: string
        tracedSource:
          $ref: '#/components/schemas/WrongEntitySource'
        traceDetail:
          type: string
          nullable: true
    WrongEntityRequest:
      type: object
      description: Report a wrong entity (AC-18.11).
      required:
      - version
      - note
      properties:
        version:
          $ref: '#/components/schemas/Version'
        note:
          type: string
      example:
        version: 2
        note: Delivery address is Calderwood Packaging Co.
    WrongEntitySource:
      type: string
      description: Same values as the DBML enum `wrong_entity_source`.
      enum:
      - BUYER_TAX_CODE
      - BUYER_NAME
      - ORDER_REFERENCE
      - ERP_DATA
      - NOT_TRACED
      x-dbml-enum: wrong_entity_source

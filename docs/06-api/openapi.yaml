openapi: 3.0.4
info:
  title: MatchPay API
  version: 1.0.0
  description: |-
    REST API contract of MatchPay for its web application: AI reads and matches incoming invoices, a Rule Engine admits clean ones to a payment batch, and authorised people sign consolidated payment requests for the legal entities of a group.

    The contract is the source of truth for paths, request and response bodies, roles, and errors (D-130). The server enforces entity scope and roles on every request; hidden controls in the interface are for convenience only (D-133).

    Every operation carries the extensions `x-roles`, `x-stories`, `x-rules`, `x-screens`, and `x-tables` (D-134) that link it to the user stories, business rules, screens, and database tables of the requirements, information architecture, UI/UX, and database documents.

    All sample data is fictional (Calderwood Group). This is a draft for review.
  contact:
    name: MatchPay documentation team
servers:
- url: /api/v1
  description: Version 1 relative to the deployment host
tags:
- name: Session
  description: Login, logout, and the current session. A server-side session behind an HttpOnly cookie (D-131).
- name: Users
  description: Create, change, and deactivate users; link them to ERP users (US-02).
- name: Group and entities
  description: The group limits, the sector list, and the entities of the group (US-03).
- name: Entity policy
  description: Tolerance, batch threshold, sample rate, and grouping mode of one entity (US-04).
- name: Approval matrix
  description: Amount tiers and approvers of one entity (US-05).
- name: Delegations
  description: Signing delegations for an absence (US-30, BR-38).
- name: Automation gates
  description: Shadow-mode accuracy and the manual gate switch per supplier and entity pair (US-06, BR-06).
- name: ERP sync
  description: 'Read-only copy of ERP data: sync runs, rejections, suppliers, items (US-07).'
- name: Recurring profiles
  description: References for electricity, water, rent, and fixed-price subscriptions (US-09).
- name: Invoices
  description: Intake, worklist, search, detail, original document, lines, and history (US-10, US-17).
- name: Mailbox
  description: The simulated invoice mailbox of an entity (US-31).
- name: Checks and evidence
  description: AI and Rule Engine results of check runs, the evidence of an invoice, re-runs, and the authority
    status (US-12 to US-16).
- name: Exceptions
  description: The exception list, detail, decision queue, and the resolution actions (US-18).
- name: Corrections and follow-ups
  description: Correction requests, data-fix notices, follow-up invoices, and cancellation notices (US-19, US-20,
    US-18).
- name: Tax-risk decisions
  description: The Chief Accountant releases or rejects a tax-risk hold (US-21).
- name: Individual approvals
  description: The Payment Approver approves or declines one exception (US-23).
- name: Service acceptance
  description: The Requesting Department confirms or rejects the acceptance of a service (US-29).
- name: Batch
  description: The period batch, the sample check, release, reopening, and withdrawal (US-24).
- name: Signing
  description: The signing queue, the request detail, signing in one action, and line removal or decline (US-25,
    US-30).
- name: ERP send
  description: Send attempts to the Entity ERP and the manual resend (US-26).
- name: Notifications
  description: In-app notifications and reminders (US-32).
- name: Dashboard and group overview
  description: Touchless rate, misplacement rate, backlog, and the group overview (US-27, US-06, US-07).
- name: Audit log
  description: The append-only audit log, read-only (US-28).
- name: Demo
  description: The ERP simulator of the demo deployment. Demo Operator only; disabled outside a demo (US-08, D-143).
security:
- sessionCookie: []
paths:
  /auth/login:
    post:
      tags:
      - Session
      summary: Log in
      description: Authenticates with email and password and starts a server-side session. The response sets the
        HttpOnly, Secure, SameSite=Strict cookie `mp_session` and returns the CSRF token for the `X-CSRF-Token`
        header (D-131). A wrong email or a wrong password gives the same 401 AUTH_INVALID_CREDENTIALS and writes
        a LOGIN_FAILED audit entry (AC-01.2, BR-12). A deactivated account with the right credentials gives 403
        AUTH_ACCOUNT_DEACTIVATED (AC-01.3). Public operation. Rate limited (DF-88).
      operationId: login
      security: []
      x-roles: []
      x-stories:
      - US-01
      x-rules:
      - BR-12
      x-screens:
      - SCR-01
      x-tables:
      - users
      - audit_log
      x-criteria:
      - AC-01.1
      - AC-01.2
      - AC-01.3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: alice@calderwood-foods.example
              password: ExamplePassword123!
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                user:
                  id: 11
                  fullName: Alice
                  email: alice@calderwood-foods.example
                  role: AP_ACCOUNTANT
                  status: ACTIVE
                  groupId: 1
                  entityId: 1
                  entityName: Calderwood Foods Co.
                  erpUserId: 301
                csrfToken: c1f4d6b8a2e04b9f9e1d7a53
                sessionExpiresAt: '2026-10-31T09:45:00+07:00'
                homeRoute: /invoices
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/AccountDeactivated'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags:
      - Session
      summary: Log out
      description: Ends the server-side session and clears the cookie. A later Back-button request to a protected
        page gets 401 AUTH_SESSION_EXPIRED (AC-01.9).
      operationId: logout
      security:
      - sessionCookie: []
        csrfHeader: []
      x-roles:
      - AP_ACCOUNTANT
      - CHIEF_ACCOUNTANT
      - PAYMENT_APPROVER
      - REQUESTING_DEPARTMENT
      - ENTITY_ADMIN
      - GROUP_ADMIN
      - DEMO_OPERATOR
      x-stories:
      - US-01
      x-rules: []
      x-screens:
      - SCR-01
      x-tables:
      - users
      - audit_log
      x-criteria:
      - AC-01.9
      responses:
        '204':
          description: Session ended; no body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/session:
    get:
      tags:
      - Session
      summary: Get the current session
      description: 'Returns the signed-in user, a fresh CSRF token, the idle expiry, and the home route of the role
        (AC-01.1, DF-28). Used on page load to decide the navigation (AC-01.7) and to redirect a signed-in user
        away from the login page. A deactivated user''s session is refused on the next request (AC-02.5): this call
        then returns 401 AUTH_SESSION_EXPIRED.'
      operationId: getSession
      security:
      - sessionCookie: []
      x-roles:
      - AP_ACCOUNTANT
      - CHIEF_ACCOUNTANT
      - PAYMENT_APPROVER
      - REQUESTING_DEPARTMENT
      - ENTITY_ADMIN
      - GROUP_ADMIN
      - DEMO_OPERATOR
      x-stories:
      - US-01
      x-rules:
      - BR-09
      x-screens:
      - SCR-01
      - SCR-90
      x-tables:
      - users
      - entities
      x-criteria:
      - AC-01.1
      - AC-01.4
      - AC-01.5
      - AC-01.6
      - AC-01.7
      - AC-01.8
      - AC-02.5
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /users:
    get:
      tags:
      - Users
      summary: List users
      description: 'Entity Admin: users of the own entity only. Group Admin: users of all entities, optionally narrowed
        by `entityId` (the Group Admin is not entity-scoped, D-147). Another entity''s users are never listed or
        reachable for an Entity Admin (AC-02.6, BR-09). The password hash is never returned.'
      operationId: listUsers
      security:
      - sessionCookie: []
      x-roles:
      - ENTITY_ADMIN
      - GROUP_ADMIN
      x-stories:
      - US-02
      x-rules:
      - BR-09
      x-screens:
      - SCR-70
      x-tables:
      - users
      - entities
      - erp_users
      x-criteria:
      - AC-02.6
      parameters:
      - name: entityId
        in: query
        required: false
        description: 'Group Admin only: show one entity.'
        schema:
          $ref: '#/components/schemas/Id'
      - name: role
        in: query
        required: false
        description: Filter by role.
        schema:
          $ref: '#/components/schemas/UserRole'
      - name: status
        in: query
        required: false
        description: Filter by status.
        schema:
          $ref: '#/components/schemas/UserStatus'
      - name: q
        in: query
        required: false
        description: Part of the name or email.
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Users
      summary: Create a user
      description: 'Creates a user with one role in one entity (D-13). Entity Admin: roles AP_ACCOUNTANT, CHIEF_ACCOUNTANT,
        PAYMENT_APPROVER, or REQUESTING_DEPARTMENT, own entity only; a request for an administrator role is refused
        (AC-02.2). Group Admin: any entity. The password has at least 8 characters (DF-32). A duplicate email gives
        422 VALIDATION_FAILED on `email` (AC-02.7). Linking an ERP user supports BR-02 and BR-36 (AC-02.4). Appends
        to audit_log (AC-02.1).'
      operationId: createUser
      security:
      - sessionCookie: []
        csrfHeader: []
      x-roles:
      - ENTITY_ADMIN
      - GROUP_ADMIN
      x-stories:
      - US-02
      x-rules:
      - BR-02
      - BR-36
      x-screens:
      - SCR-71
      x-tables:
      - users
      - entities
      - erp_users
      - audit_log
      x-criteria:
      - AC-02.1
      - AC-02.2
      - AC-02.3
      - AC-02.4
      - AC-02.7
      - AC-02.9
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}:
    get:
      tags:
      - Users
      summary: Get a user
      description: Returns one user. A user outside the caller's scope gives 403 ACCESS_DENIED whether or not it
        exists (D-132, AC-02.6).
      operationId: getUser
      security:
      - sessionCookie: []
      x-roles:
      - ENTITY_ADMIN
      - GROUP_ADMIN
      x-stories:
      - US-02
      x-rules:
      - BR-09
      x-screens:
      - SCR-70
      - SCR-71
      x-tables:
      - users
      - erp_users
      - entities
      x-criteria:
      - AC-02.6
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - Users
      summary: Change a user
      description: 'Changes the name, the role, or the ERP user link. A second role or a second entity is refused:
        "A user has one role in one entity in the MVP" (AC-02.3, D-13). An administrator cannot change their own
        role (AC-02.8). Entity Admin cannot give an administrator role (AC-02.2). Carries `version` (D-136). Appends
        to audit_log with the old and new values.'
      operationId: updateUser
      security:
      - sessionCookie: []
        csrfHeader: []
      x-roles:
      - ENTITY_ADMIN
      - GROUP_ADMIN
      x-stories:
      - US-02
      x-rules:
      - BR-02
      - BR-36
      x-screens:
      - SCR-71
      x-tables:
      - users
      - erp_users
      - audit_log
      x-criteria:
      - AC-02.2
      - AC-02.3
      - AC-02.4
      - AC-02.8
      parameters:
      - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}/deactivate:
    post:
      tags:
      - Users
      summary: Deactivate a user
      description: The user cannot log in, their open sessions end on the next request, and earlier decisions and
        signatures stay unchanged (AC-02.5). An administrator cannot deactivate their own account (AC-02.8). Carries
        `version`. Appends to audit_log.
      operationId: deactivateUser
      security:
      - sessionCookie: []
        csrfHeader: []
      x-roles:
      - ENTITY_ADMIN
      - GROUP_ADMIN
      x-stories:
      - US-02
      x-rules: []
      x-screens:
      - SCR-72
      x-tables:
      - users
      - audit_log
      x-criteria:
      - AC-02.5
      - AC-02.8
      parameters:
      - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionOnly'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /erp-users:
    get:
      tags:
      - Users
      summary: List ERP users to link
      description: 'Lists the ERP users copied by the sync for the link in the user form (AC-02.4). Entity Admin:
        own entity. Group Admin: `entityId` is required.'
      operationId: listErpUsers
      security:
      - sessionCookie: []
      x-roles:
      - ENTITY_ADMIN
      - GROUP_ADMIN
      x-stories:
      - US-02
      x-rules:
      - BR-02
      x-screens:
      - SCR-71
      x-tables:
      - erp_users
      - entities
      x-criteria:
      - AC-02.4
      parameters:
      - name: entityId
        in: query
        required: false
        description: Group Admin only.
        schema:
          $ref: '#/components/schemas/Id'
      - name: q
        in: query
        required: false
        description: Part of the display name.
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpUserRefPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /group:
    get:
      tags:
      - Group and entities
      summary: Get the group and its limits
      description: Returns the group name and the maximums for the price tolerance and the batch threshold (BR-16).
        The Entity Admin reads them to show "Maximum allowed by the group" next to each policy field (SCR-73).
      operationId: getGroup
      security:
      - sessionCookie: []
      x-roles:
      - GROUP_ADMIN
      - ENTITY_ADMIN
      x-stories:
      - US-03
      - US-04
      x-rules:
      - BR-16
      x-screens:
      - SCR-73
      - SCR-76
      x-tables:
      - corporate_groups
      x-criteria:
      - AC-03.3
      - AC-04.2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /group/limits:
    patch:
      tags:
      - Group and entities
      summary: Set the group limits
      description: Sets the maximum price tolerance and the maximum batch threshold. Lowering a maximum below an
        entity value lowers that value in the same transaction, one audit entry each (AC-03.4, BR-16); the response
        lists every adjustment. Carries `version`.
      operationId: updateGroupLimits
      security:
      - sessionCookie: []
        csrfHeader: []
      x-roles:
      - GROUP_ADMIN
      x-stories:
      - US-03
      x-rules:
      - BR-16
      x-screens:
      - SCR-76
      x-tables:
      - corporate_groups
      - entity_policies
      - entities
      - audit_log
      x-criteria:
      - AC-03.3
      - AC-03.4
      - AC-03.5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupLimitsUpdate'
            example:
              version: 2
              maxPriceTolerancePct: '5.00'
              maxBatchThresholdVnd: '300000000.00'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupLimitsResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /group/sectors:
    get:
      tags:
      - Group and entities
      summary: List the sectors allowed to issue non-coded invoices
      description: Returns the active sector list; the default holds only electricity (D-24, DF-25). A seller's
        sector comes from the ERP supplier data and is compared with this list ignoring case (D-71).
      operationId: listSectors
      security:
      - sessionCookie: []
      x-roles:
      - GROUP_ADMIN
      x-stories:
      - US-03
      x-rules:
      - BR-17
      x-screens:
      - SCR-76
      x-tables:
      - group_sectors
      x-criteria:
      - AC-03.6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Group and entities
      summary: Add a sector
      description: Adds a sector to the list (AC-03.6). Appends to audit_log.
      operationId: addSector
      security:
      - sessionCookie: []
        csrfHeader: []
      x-roles:
      - GROUP_ADMIN
      x-stories:
      - US-03
      x-rules:
      - BR-17
      x-screens:
      - SCR-76
      x-tables:
      - group_sectors
      - audit_log
      x-criteria:
      - AC-03.6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectorCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sector'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /group/sectors/{sectorId}:
    delete:
      tags:
      - Group and entities
      summary: Remove a sector
      description: Marks the entry removed (nothing is deleted, D-65). Invoices of that sector without a tax-authority
        code become exceptions from the next check (AC-03.6). Appends to audit_log.
      operationId: removeSector
      security:
      - sessionCookie: []
        csrfHeader: []
      x-roles:
      - GROUP_ADMIN
      x-stories:
      - US-03
      x-rules:
      - BR-17
      x-screens:
      - SCR-76
      x-tables:
      - group_sectors
      - audit_log
      x-criteria:
      - AC-03.6
      parameters:
      - $ref: '#/components/parameters/sectorId'
      responses:
        '204':
          description: Removed; no body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /entities:
    get:
      tags:
      - Group and entities
      summary: List the entities of the group
      description: Lists entities with name and tax code (SCR-76). Group Admin only; an Entity Admin reads only
        the own entity through the policy and matrix operations (AC-03.5).
      operationId: listEntities
      security:
      - sessionCookie: []
      x-roles:
      - GROUP_ADMIN
      x-stories:
      - US-03
      x-rules:
      - BR-01
      x-screens:
      - SCR-76
      x-tables:
      - entities
      - corporate_groups
      x-criteria:
      - AC-03.5
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Group and entities
      summary: Add an entity
      description: Creates an entity with a unique 10-digit tax code (BR-01) and default policy values inside the
        group limits (AC-03.1). A duplicate tax code gives 422 VALIDATION_FAILED on `taxCode` (AC-03.2). Appends
        to audit_log.
      operationId: createEntity
      security:
      - sessionCookie: []
        csrfHeader: []
      x-roles:
      - GROUP_ADMIN
      x-stories:
      - US-03
      x-rules:
      - BR-01
      - BR-16
      x-screens:
      - SCR-77
      x-tables:
      - entities
      - entity_policies
      - corporate_groups
      - audit_log
      x-criteria:
      - AC-03.1

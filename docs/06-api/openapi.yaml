        id: 1042
        series: C26TAA
        number: '0000123'
        invoiceNumber: C26TAA-0000123
        sellerName: Brightfield Paper Ltd
        supplierId: 51
        flow: GOODS_WITH_ORDER
        totalAmount: '6600000.00'
        invoiceDate: '2026-10-28'
        dueDate: '2026-11-27'
        dueSoon: false
        state: EXCEPTION
        source: UPLOAD
        invoiceKind: ORIGINAL
        openExceptionId: 2201
        replyDue: false
        receivedAt: '2026-10-31T08:50:00+07:00'
        version: 4

          end: '2026-10-31'
          label: October 2026
        touchless:
          rate: '67.4'
          numerator: 62
          denominator: 92
          formula: 62 admitted without a person / (100 received - 8 separated)
        touchlessValid: false
        misplacement:
          rate: '5.0'
          withdrawnAfterSampleError: 1
          sampledCount: 20
          note: Estimated from a sample weighted by risk, not a random sample
          aboveLimit: true
        receivedCount: 100
        separatedCount: 8
        rejectedCount: 4
        backlog:
        - state: OPEN

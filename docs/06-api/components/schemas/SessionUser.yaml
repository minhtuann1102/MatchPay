type: object
description: The signed-in user.
required:
  - id
  - fullName
  - email
  - role
  - status
  - groupId
properties:
  id:
    $ref: ./Id.yaml
  fullName:
    type: string
  email:
    type: string
    format: email
  role:
    $ref: ./UserRole.yaml
  status:
    $ref: ./UserStatus.yaml
  groupId:
    $ref: ./Id.yaml
  entityId:
    type: integer
    allOf:
      - $ref: ./Id.yaml
    nullable: true
    description: NULL for the Group Admin and the Demo Operator, who belong to the group.
  entityName:
    type: string
    nullable: true
  erpUserId:
    type: integer
    allOf:
      - $ref: ./Id.yaml
    nullable: true

type: object
description: The approval matrix of the caller's entity (SCR-74).
required:
  - matrixVersion
  - tiers
  - updatedAt
properties:
  matrixVersion:
    $ref: ./Version.yaml
  tiers:
    type: array
    items:
      $ref: ./ApprovalTier.yaml
  updatedAt:
    type: string
    format: date-time
example:
  matrixVersion: 3
  updatedAt: '2026-10-01T08:00:00+07:00'
  tiers:
    - id: 1
      levelName: Department Head
      minAmount: '0.00'
      maxAmount: '49999999.99'
      isActive: true
      approvers:
        - userId: 13
          fullName: Dan
          status: ACTIVE
    - id: 2
      levelName: CFO
      minAmount: '50000000.00'
      isActive: true
      approvers:
        - userId: 14
          fullName: Fiona
          status: ACTIVE

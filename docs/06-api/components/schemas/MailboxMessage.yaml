type: object
description: >-
  A message of the entity mailbox. A message fetched before is never processed
  again (AC-31.4).
required:
  - id
  - fetchRunId
  - mailboxAddress
  - messageIdentifier
  - senderAddress
  - receivedAt
  - outcome
  - attachments
properties:
  id:
    $ref: ./Id.yaml
  fetchRunId:
    $ref: ./Id.yaml
  mailboxAddress:
    type: string
  messageIdentifier:
    type: string
  senderAddress:
    type: string
  subject:
    type: string
    nullable: true
  sentAt:
    type: string
    format: date-time
    nullable: true
  receivedAt:
    type: string
    format: date-time
  processedAt:
    type: string
    format: date-time
    nullable: true
  outcome:
    $ref: ./MessageOutcome.yaml
  attachments:
    type: array
    items:
      $ref: ./MailboxAttachment.yaml

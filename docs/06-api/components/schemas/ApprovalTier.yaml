type: object
description: One amount tier of the approval matrix (BR-03).
required:
  - id
  - levelName
  - minAmount
  - isActive
  - approvers
properties:
  id:
    $ref: ./Id.yaml
  levelName:
    type: string
  minAmount:
    $ref: ./Money.yaml
  maxAmount:
    type: string
    allOf:
      - $ref: ./Money.yaml
    nullable: true
    description: NULL for the open-ended top tier.
  isActive:
    type: boolean
  approvers:
    type: array
    items:
      $ref: ./ApproverRef.yaml
